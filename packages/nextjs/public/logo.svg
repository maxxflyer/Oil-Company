<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Ethereum Oil Company</title>
  <defs>
    <linearGradient id="crude" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="0.55" stop-color="#b026ff" />
      <stop offset="1" stop-color="#ff2e97" />
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="soft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- La goccia: sale stretta e si allarga in basso, come una goccia che cade. -->
  <path
    d="M32 4C32 4 12 26.5 12 39a20 20 0 0 0 40 0C52 26.5 32 4 32 4Z"
    fill="#070510"
    stroke="url(#crude)"
    stroke-width="3"
    filter="url(#neon)"
  />
  <!-- Il riflesso, che le dà lo spessore -->
  <path d="M24 38a8 8 0 0 1 5-7.4" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
</svg>
